<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Studio — Random Data &amp; Dev Toolkit</title>
<meta name="description" content="A fast, modern, all-in-one random data & developer QoL toolkit — numbers, strings, passwords, fake profiles, bulk rename, XP curves, and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --bg:#0b0c12; --bg-elev:#12141e; --surface:#171923; --surface-2:#1e2130;
  --border:#2a2d3d; --text:#eef0fa; --text-dim:#8d92ab;
  --accent:#7c6cf6; --accent-2:#9d8bff; --accent-soft:rgba(124,108,246,.16);
  --warm:#f6b76b; --warm-soft:rgba(246,183,107,.18);
  --success:#3ddc97; --warning:#f5b942; --danger:#f2596b;
  --radius:14px; --radius-sm:9px;
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Code',monospace;
  --sidebar-w:250px;
  color-scheme: dark;
}
:root.light{
  --bg:#f4f5fb; --bg-elev:#ffffff; --surface:#ffffff; --surface-2:#eef0f8;
  --border:#dde1ee; --text:#161822; --text-dim:#666b82;
  --accent:#6a55f0; --accent-2:#5843d6; --accent-soft:rgba(106,85,240,.10);
  --warm:#c97a2e; --warm-soft:rgba(201,122,46,.12);
  --success:#1fa971; --warning:#c9861a; --danger:#d63c52;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit; color:inherit;}
::selection{ background:var(--accent); color:#fff; }
a{ color:var(--accent-2); }

/* scrollbars */
*{scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
*::-webkit-scrollbar{width:9px; height:9px;}
*::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
*::-webkit-scrollbar-thumb:hover{background:var(--accent);}
*::-webkit-scrollbar-track{background:transparent;}

/* focus visibility */
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

/* ---------- App shell ---------- */
#app{ display:flex; height:100vh; width:100vw; }

.sidebar{
  width:var(--sidebar-w); flex:0 0 auto; background:var(--bg-elev);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding:18px 14px; gap:4px; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 4px; }
.brand-mark{
  width:30px; height:30px; border-radius:9px; flex:none;
  background:linear-gradient(135deg,var(--accent),var(--warm));
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-title{ font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:.2px; }
.brand-sub{ font-size:10.5px; color:var(--text-dim); }

.palette-hint{
  margin:12px 8px 10px; padding:8px 10px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:11.5px; color:var(--text-dim);
  display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  background:var(--surface); transition:border-color .15s;
}
.palette-hint:hover{ border-color:var(--accent); color:var(--text); }
.kbd{
  font-family:var(--font-mono); font-size:10.5px; padding:1px 6px;
  border:1px solid var(--border); border-radius:5px; background:var(--surface-2);
}

.nav{ display:flex; flex-direction:column; gap:2px; margin-top:6px; overflow-y:auto; flex:1; }
.nav-group-label{
  font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);
  padding:12px 10px 4px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px;
  cursor:pointer; color:var(--text-dim); font-size:13px; user-select:none;
  border:1px solid transparent; transition:background .12s, color .12s;
}
.nav-item .icon{ font-size:15px; width:18px; text-align:center; flex:none; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; border-color:var(--accent); }

.sidebar-foot{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }

/* ---------- Main area ---------- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; }

.topbar{
  display:flex; align-items:center; gap:10px; padding:10px 22px;
  border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none;
}
.topbar .spacer{ flex:1; }
.seed-field{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
.hamburger{ display:none; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 11px; font-size:15px; line-height:1; cursor:pointer; flex:none; }

.content{ flex:1; overflow-y:auto; padding:26px 30px 40px; }
.page{ display:none; max-width:1200px; margin:0 auto; }
.page.active{ display:block; animation:fadein .18s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.page-head{ margin-bottom:18px; }
.page-title{ font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 4px; }
.page-sub{ color:var(--text-dim); font-size:13px; max-width:640px; line-height:1.5; }

.page-body{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
.page-body.stack{ flex-direction:column; }

/* ---------- Cards / controls ---------- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
.controls-card{ padding:18px; width:330px; flex:0 0 330px; display:flex; flex-direction:column; gap:11px; }
.results-col{ flex:1 1 420px; min-width:320px; display:flex; flex-direction:column; gap:10px; }

.field-row{ display:flex; align-items:center; gap:10px; }
.field-row label{ min-width:96px; font-size:12.5px; color:var(--text-dim); flex:none; }
.field-row.wide label{ min-width:0; }
.field-row > *:last-child:not(label){ flex:1; }
.field-row input, .field-row select{ min-width:0; }

.field-check{ display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; }
.field-check input{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }

input[type=text],input[type=number],input[type=password],select,textarea{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:7px 10px; font-size:13px; width:100%;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{ border-color:var(--accent); outline:none; }
textarea{ font-family:var(--font-mono); font-size:12.5px; resize:vertical; }
input[type=range]{ accent-color:var(--accent); flex:1; }

select{ appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238d92ab'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; padding-right:26px;
}

button{
  font-size:12.5px; font-weight:500; padding:7px 13px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer;
  transition:background .12s, border-color .12s, transform .05s;
}
button:hover{ background:var(--border); }
button:active{ transform:scale(.98); }
button.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border:none;
  font-weight:700; padding:9px 16px; font-size:13px; width:100%;
}
button.primary:hover{ filter:brightness(1.08); }
button.ghost{ background:transparent; }
button.danger{ background:transparent; color:var(--danger); border-color:var(--danger); }
button.danger:hover{ background:var(--danger); color:#fff; }
button:disabled{ opacity:.45; cursor:not-allowed; }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

.hint{ font-size:11.5px; color:var(--text-dim); line-height:1.5; }
.stat{ color:var(--accent); font-weight:600; font-size:12px; }

/* ---------- Results list ---------- */
.results-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.results-head h3{ font-size:13px; margin:0; font-weight:600; }
.results-head .spacer{ flex:1; }

.results-list{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:6px; max-height:520px; overflow-y:auto; font-family:var(--font-mono); font-size:12.5px;
}
.results-list .empty{ padding:30px 10px; text-align:center; color:var(--text-dim); font-family:var(--font-body); }
.result-item{
  padding:7px 9px; border-radius:7px; cursor:pointer; display:flex; justify-content:space-between; gap:8px;
}
.result-item:hover{ background:var(--surface); }
.result-item .copied-badge{ color:var(--success); font-family:var(--font-body); font-size:11px; opacity:0; transition:opacity .15s; }
.result-item.flash .copied-badge{ opacity:1; }

.output-box{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; font-family:var(--font-mono); font-size:12.5px; white-space:pre-wrap;
  word-break:break-word; max-height:480px; overflow-y:auto; min-height:120px;
}

/* ---------- Toggle / theme switch ---------- */
.theme-toggle{ display:flex; align-items:center; justify-content:space-between; }

/* ---------- Toast ---------- */
#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(16px);
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:10px 18px; border-radius:12px; font-size:12.5px; box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:500;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- Command palette ---------- */
#palette-overlay{
  position:fixed; inset:0; background:rgba(5,6,10,.55); backdrop-filter:blur(2px);
  display:none; align-items:flex-start; justify-content:center; padding-top:12vh; z-index:600;
}
#palette-overlay.show{ display:flex; }
.palette{
  width:min(560px,90vw); background:var(--bg-elev); border:1px solid var(--accent);
  border-radius:16px; box-shadow:0 0 0 1px var(--accent-soft), 0 30px 80px rgba(0,0,0,.5);
  overflow:hidden;
}
.palette input{
  width:100%; border:none; border-bottom:1px solid var(--border); background:transparent;
  padding:16px 18px; font-size:15px; color:var(--text);
}
.palette input:focus{ outline:none; }
.palette-results{ max-height:50vh; overflow-y:auto; padding:6px; }
.palette-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13px;
}
.palette-item.sel{ background:var(--accent-soft); color:var(--accent); }
.palette-item .icon{ width:18px; text-align:center; }
.palette-empty{ padding:24px; text-align:center; color:var(--text-dim); font-size:12.5px; }

/* ---------- Strength bar ---------- */
.strength-bar{ height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.strength-bar > div{ height:100%; border-radius:4px; transition:width .15s, background .15s; }

/* ---------- Color swatches ---------- */
.swatch-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
.swatch{
  height:76px; border-radius:12px; display:flex; align-items:flex-end; padding:9px; cursor:pointer;
  font-size:10.5px; font-weight:700; font-family:var(--font-mono);
}

/* ---------- Groups (checkbox categories, e.g. Fake Profiles) ---------- */
.field-group{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
.field-group-title{ font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
.checkbox-scroll{ max-height:300px; overflow-y:auto; padding-right:4px; }

/* ---------- Table (Progression Scaler) ---------- */
table.data-table{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; }
table.data-table th,table.data-table td{ padding:7px 10px; border-bottom:1px solid var(--border); text-align:left; }
table.data-table th{ color:var(--text-dim); font-weight:600; position:sticky; top:0; background:var(--surface-2); }
.table-wrap{ max-height:420px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); }

canvas.curve-canvas{ width:100%; height:150px; display:block; }

/* ---------- History drawer ---------- */
#history-drawer{
  position:fixed; top:0; right:-360px; width:340px; height:100%; background:var(--bg-elev);
  border-left:1px solid var(--border); z-index:400; transition:right .2s ease; display:flex; flex-direction:column;
}
#history-drawer.open{ right:0; }
.history-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px; border-bottom:1px solid var(--border); }
.history-list{ flex:1; overflow-y:auto; padding:8px; }
.history-entry{ padding:9px 10px; border-radius:9px; font-size:12px; cursor:pointer; }
.history-entry:hover{ background:var(--surface-2); }
.history-entry time{ color:var(--text-dim); font-size:10.5px; display:block; margin-bottom:2px; }

/* ---------- Bulk renamer / drop zone ---------- */
.dropzone{
  border:1.5px dashed var(--border); border-radius:var(--radius); padding:22px; text-align:center;
  color:var(--text-dim); font-size:12.5px; cursor:pointer; transition:border-color .15s, color .15s;
}
.dropzone:hover, .dropzone.drag{ border-color:var(--accent); color:var(--text); }
.conflict{ color:var(--danger) !important; }

/* ---------- Warning / notice card ---------- */
.notice{
  border:1px solid var(--warning); background:var(--warm-soft); border-radius:var(--radius);
  padding:14px 16px; font-size:12.5px; line-height:1.6; margin-bottom:14px;
}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .sidebar{ position:fixed; inset:0 auto 0 0; z-index:300; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.4); }
  .sidebar.open{ transform:translateX(0); }
  .hamburger{ display:flex; }
  .controls-card{ width:100%; flex:1 1 100%; }
  .page-body{ flex-direction:column; }
  .content{ padding:18px 16px 32px; }
  .topbar{ padding:10px 12px; gap:8px; }
  .seed-field{ flex:1; min-width:0; }
  .seed-field span{ display:none; }
  .seed-field input{ width:100% !important; min-width:0; }
}
@media (max-width:480px){
  .topbar #aboutBtn{ display:none; }
  .swatch-grid{ grid-template-columns:repeat(2,1fr); }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>
<div id="app">


  <nav class="sidebar" id="sidebar">
    <div class="brand">

      <div class="brand-text">
        <div class="brand-title">Random Studio</div>
        <div class="brand-sub">Random data & dev toolkit</div>

      <div class="spacer"></div>

    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="palette-overlay">
  <div class="palette">
    <input type="text" id="paletteInput" placeholder="Search tools…" autocomplete="off">
    <div class="palette-results" id="paletteResults"></div>

</div>

<div id="history-drawer">
  <div class="history-head">

  <div class="history-list" id="historyList"></div>
</div>

<div id="toast"></div>

/* ============================================================
   UTILITIES
   ============================================================ */
function ri(min, max){ // secure random int inclusive, using crypto
  min = Math.ceil(min); max = Math.floor(max);
  const range = max - min + 1;
  if (range <= 0) return min;
  const buf = new Uint32Array(1);
  const maxUint = 0xFFFFFFFF;
  const limit = maxUint - (maxUint % range);
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x > limit);
  return min + (x % range);
}
function riFast(min, max){ // non-secure, seedable via Math.random (used when a seed is set)
  min = Math.ceil(min); max = Math.floor(max);
  return Math.floor(RNG.next() * (max - min + 1)) + min;
}
function rf(min, max, decimals=2){
  const v = RNG.seeded ? RNG.next() : (crypto.getRandomValues(new Uint32Array(1))[0] / 0xFFFFFFFF);
  return +(min + v * (max - min)).toFixed(decimals);
}
function rc(arr){ // random choice
  return arr[RNG.seeded ? Math.floor(RNG.next() * arr.length) : ri(0, arr.length - 1)];
}
function rint(min, max){ return RNG.seeded ? riFast(min, max) : ri(min, max); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rint(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Simple seedable PRNG (mulberry32) so the optional "seed" field gives reproducible runs.
const RNG = {
  seeded: false, _state: 0,
  seed(str){
    if (!str) { this.seeded = false; return; }
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    this._state = h >>> 0; this.seeded = true;
  },
  next(){
    let t = this._state += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
};

function fibSeq(n){
  if (n <= 0) return 0;
  let a = 1, b = 1;
  for (let i = 0; i < n - 1; i++){ [a, b] = [b, a + b]; }
  return a;
}

function caesarShift(text, shift){
  shift = ((shift % 26) + 26) % 26;
  let out = "";
  for (const ch of text){
    if (ch >= "a" && ch <= "z") out += String.fromCharCode((ch.charCodeAt(0) - 97 + shift) % 26 + 97);
    else if (ch >= "A" && ch <= "Z") out += String.fromCharCode((ch.charCodeAt(0) - 65 + shift) % 26 + 65);
    else out += ch;
  }
  return out;
}

function luhnCheckDigit(digitsWithoutCheck){
  let sum = 0, alt = true;
  for (let i = digitsWithoutCheck.length - 1; i >= 0; i--){
    let d = digitsWithoutCheck[i];
    if (alt){ d *= 2; if (d > 9) d -= 9; }
    sum += d; alt = !alt;
  }
  return (10 - (sum % 10)) % 10;
}
function fakeCardNumber(brand){
  let prefix, length;
  if (brand === "American Express"){ prefix = rc(["34","37"]); length = 15; }
  else if (brand === "Discover"){ prefix = "6011"; length = 16; }
  else if (brand === "Mastercard"){ prefix = String(ri(51,55)); length = 16; }
  else { prefix = "4"; length = 16; } // Visa
  const digits = prefix.split("").map(Number);
  while (digits.length < length - 1) digits.push(ri(0,9));
  digits.push(luhnCheckDigit(digits));
  const s = digits.join("");
  return s.replace(/(.{4})/g, "$1 ").trim();
}

async function sha(str, algo){ // algo: 'SHA-1' | 'SHA-256' | 'SHA-384' | 'SHA-512'
  const buf = await crypto.subtle.digest(algo, new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function el(tag, attrs={}, children=[]){
  const node = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)){
    if (c === null || c === undefined) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function copyText(text){
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => toast("Copied to clipboard")).catch(() => toast("Copy failed"));
}

const NAV = []; // populated by each page module via registerPage()
const PAGES = {};
let currentKey = null;
const historyEntries = [];

function registerPage(key, icon, label, group, mount){
  NAV.push({key, icon, label, group});
  PAGES[key] = mount;
}

function logHistory(category, items){
  if (!items || !items.length) return;
  const stamp = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  historyEntries.unshift({stamp, category, items});
  if (historyEntries.length > 200) historyEntries.length = 200;
  renderHistory();
  toast(`Generated ${items.length} item${items.length===1?"":"s"} — ${category}`);
}

function renderHistory(){
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  if (!historyEntries.length){
    list.appendChild(el("div", {class:"hint", style:"padding:16px;"}, "Nothing generated yet."));
    return;
  }
  for (const entry of historyEntries){
    const preview = entry.items.slice(0,3).join(", ") + (entry.items.length > 3 ? ` … (+${entry.items.length-3})` : "");
    const node = el("div", {class:"history-entry", onclick:() => copyText(entry.items.join("\n"))}, [
      el("time", {}, entry.stamp),
      el("div", {}, `${entry.category}: ${preview}`)
    ]);
    list.appendChild(node);
  }
}

function renderSidebar(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  let lastGroup = null;
  for (const item of NAV){
    if (item.group !== lastGroup){
      nav.appendChild(el("div", {class:"nav-group-label"}, item.group));
      lastGroup = item.group;
    }
    const node = el("div", {class:"nav-item" + (item.key === currentKey ? " active" : ""), onclick:() => selectPage(item.key)}, [
      el("span", {class:"icon"}, item.icon),
      el("span", {}, item.label)
    ]);
    node.dataset.key = item.key;
    nav.appendChild(node);
  }
}

function selectPage(key){
  currentKey = key;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.key === key));
  const content = document.getElementById("content");
  content.innerHTML = "";
  const page = el("div", {class:"page active"});
  content.appendChild(page);
  PAGES[key](page);
  document.getElementById("sidebar").classList.remove("open");
  content.scrollTop = 0;
}

let paletteSel = 0, paletteMatches = [];

  renderPaletteResults("");
}
function closePalette(){ document.getElementById("palette-overlay").classList.remove("show"); }
function renderPaletteResults(q){
  q = q.trim().toLowerCase();
  paletteMatches = NAV.filter(i => !q || i.label.toLowerCase().includes(q) || i.group.toLowerCase().includes(q));
  paletteSel = 0;
  const box = document.getElementById("paletteResults");
  box.innerHTML = "";
  if (!paletteMatches.length){
    box.appendChild(el("div", {class:"palette-empty"}, "No matching tools."));
    return;
  }
  paletteMatches.forEach((item, i) => {
    const node = el("div", {class:"palette-item" + (i===0?" sel":""), onclick:() => { selectPage(item.key); closePalette(); }}, [
      el("span", {class:"icon"}, item.icon),
      el("span", {}, item.label),
    ]);
    box.appendChild(node);
  });
}
function movePaletteSel(delta){
  if (!paletteMatches.length) return;
  paletteSel = (paletteSel + delta + paletteMatches.length) % paletteMatches.length;
  [...document.querySelectorAll(".palette-item")].forEach((n,i) => n.classList.toggle("sel", i===paletteSel));
}

/**
 * Builds a standard "results" column: header (title, count, copy/export/clear),
 * a list of generated strings, and a hint. Returns an API to set/get items.
 */
function resultsColumn(body, opts={}){
  const col = el("div", {class:"results-col"});
  body.appendChild(col);

  const countLabel = el("span", {class:"stat"}, "");
  const head = el("div", {class:"results-head"}, [
    el("h3", {}, "Results"),
    countLabel,
    el("div", {class:"spacer"}),
  ]);

  const copyAllBtn = el("button", {class:"ghost"}, "Copy All");
  const fmtSelect = makeSelect([["txt","TXT"],["csv","CSV"],["json","JSON"]]);
  fmtSelect.style.width = "auto";
  const exportBtn = el("button", {class:"ghost"}, "Export");
  const clearBtn = el("button", {class:"ghost"}, "Clear");
  head.append(copyAllBtn, fmtSelect, exportBtn, clearBtn);
  col.appendChild(head);

  const list = el("div", {class:"results-list"});
  list.appendChild(el("div", {class:"empty"}, "Nothing generated yet — set your options and click Generate."));
  col.appendChild(list);
  col.appendChild(el("div", {class:"hint"}, opts.hint || "Click any result to copy it."));

  let items = [];
  function render(){
    list.innerHTML = "";
    if (!items.length){
      list.appendChild(el("div", {class:"empty"}, "Nothing generated yet — set your options and click Generate."));
      countLabel.textContent = "";
      return;
    }
    items.forEach(text => {
      const badge = el("span", {class:"copied-badge"}, "copied ✓");
      const row = el("div", {class:"result-item"}, [el("span", {}, text), badge]);
      row.addEventListener("click", () => {
        copyText(text);
        row.classList.add("flash");
        setTimeout(() => row.classList.remove("flash"), 900);
      });
      list.appendChild(row);
    });
    countLabel.textContent = `${items.length} item${items.length===1?"":"s"}`;
  }
  function setItems(newItems, category){
    items = newItems;
    render();
    if (category) logHistory(category, items);
  }
  copyAllBtn.addEventListener("click", () => copyText(items.join("\n")));
  clearBtn.addEventListener("click", () => { items = []; render(); });
  exportBtn.addEventListener("click", () => {
    if (!items.length){ toast("Nothing to export yet"); return; }
    const fmt = fmtSelect.value;
    const base = (opts.filenameBase || "results");
    if (fmt === "txt") downloadBlob(`${base}.txt`, items.join("\n"), "text/plain");
    else if (fmt === "csv"){
      const csvBody = "value\n" + items.map(v => `"${String(v).replace(/"/g,'""')}"`).join("\n");
      downloadBlob(`${base}.csv`, csvBody, "text/csv");
    } else downloadBlob(`${base}.json`, JSON.stringify(items, null, 2), "application/json");
  });

  return { setItems, getItems: () => items, listEl: list, colEl: col };
}

  const secureF = checkField("Cryptographically secure", true); card.appendChild(secureF.wrap);
  const statsHint = el("div", {class:"hint"}, "");
  card.appendChild(statsHint);

  function syncMode(){
    const m = mode.value;
    const isDice = m.startsWith("Dice");
    const isFloat = m === "Float";
    [decimals].forEach(w => w.closest ? null : null);
    decimals.disabled = !isFloat;
    diceN.disabled = !isDice; diceSides.disabled = !isDice;
    minInput.disabled = isDice; maxInput.disabled = isDice;
    uniqueF.input.disabled = isDice;
    minInput.step = isFloat ? "any" : "1";
    maxInput.step = isFloat ? "any" : "1";
    if (!isFloat){ minInput.value = Math.round(+minInput.value || 0); maxInput.value = Math.round(+maxInput.value || 0); }
  }
  [minInput, maxInput].forEach(inp => inp.addEventListener("input", () => {
    if (mode.value !== "Float") inp.value = inp.value.replace(/[^\d-]/g, "");
  }));
  mode.addEventListener("change", syncMode);
  syncMode();

  const results = resultsColumn(body, {filenameBase:"numbers"});
  card.appendChild(primaryButton("Generate", () => {
    const secure = secureF.input.checked;
    const n = +count.value;
    const pick = (a,b) => secure ? ri(a,b) : rint(a,b);
    if (mode.value.startsWith("Dice")){
      const sides = +diceSides.value, dice = +diceN.value;
      const items = [];
      for (let i=0;i<n;i++){
        const rolls = Array.from({length:dice}, () => pick(1,sides));
        items.push(`${rolls.reduce((a,b)=>a+b,0)}  (${rolls.join(" + ")})`);
      }
      statsHint.textContent = `Rolling ${dice}d${sides} × ${n}`;
      results.setItems(items, "Numbers"); return;
    }
    let a = +minInput.value, b = +maxInput.value;
    if (a > b) [a,b] = [b,a];
    let values = [];
    if (mode.value === "Integer"){
      a = Math.round(a); b = Math.round(b);
      if (uniqueF.input.checked){
        const span = b - a + 1;
        if (n > span){ toast(`Can't pick ${n} unique ints from a range of ${span}.`); return; }
        const pool = shuffle(Array.from({length:span}, (_,i) => a+i));
        values = pool.slice(0, n);
      } else {
        values = Array.from({length:n}, () => pick(a,b));
      }
    } else {
      const dec = +decimals.value;
      values = Array.from({length:n}, () => {
        const v = secure ? (a + (crypto.getRandomValues(new Uint32Array(1))[0]/0xFFFFFFFF)*(b-a)) : (a + RNG.next()*(b-a));
        return +v.toFixed(dec);
      });
    }
    if (sortF.input.checked) values.sort((x,y)=>x-y);
    if (values.length){
      const sum = values.reduce((s,v)=>s+v,0);
      statsHint.textContent = `min ${Math.min(...values)} · max ${Math.max(...values)} · avg ${(sum/values.length).toFixed(3)} · sum ${sum}`;
    }
    results.setItems(values.map(String), "Numbers");
  }));
});

  const custom = makeText("extra custom characters (optional)"); card.appendChild(fieldRow("Custom", custom));
  const uniqueF = checkField("Unique strings only"); card.appendChild(uniqueF.wrap);
  const secureF = checkField("Cryptographically secure", true); card.appendChild(secureF.wrap);

  const AMBIGUOUS = "Il1O0|`'\",.;:";
  function buildCharset(){
    let s = "";
    if (lowerF.input.checked) s += "abcdefghijklmnopqrstuvwxyz";
    if (upperF.input.checked) s += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (digitsF.input.checked) s += "0123456789";
    if (symbolsF.input.checked) s += "!@#$%^&*()-_=+[]{};:,.<>?/~";
    s += custom.value || "";
    if (ambF.input.checked) s = [...s].filter(c => !AMBIGUOUS.includes(c)).join("");
    return [...new Set(s)].join("");
  }

  const results = resultsColumn(body, {filenameBase:"strings"});
  card.appendChild(primaryButton("Generate", () => {
    const charset = buildCharset();
    if (!charset){ toast("Enable at least one character set."); return; }
    const secure = secureF.input.checked;

    const items = [];

      attempts++;
      if (attempts > maxAttempts){ toast("Can't satisfy uniqueness with this length/charset."); break; }
      let s = ""; for (let i=0;i<len;i++) s += pickChar();
      if (seen){ if (seen.has(s)) continue; seen.add(s); }
      items.push(s);
    }
    results.setItems(items, "Strings");
  }));
});

registerPage("passwords", "🔐", "Passwords", "Core Generators", (container) => {
  pageHeader(container, "Passwords", "Generate strong, secure passwords with a live strength meter.");
  const body = pageBody(container);
  const card = controlsCard(body);

  const lengthWrap = el("input", {type:"range", min:4, max:128, value:20});
  const lengthLbl = el("span", {}, "20");
  lengthWrap.addEventListener("input", () => lengthLbl.textContent = lengthWrap.value);
  const lenRow = el("div", {style:"display:flex; gap:8px; align-items:center; flex:1;"}, [lengthWrap, lengthLbl]);
  card.appendChild(fieldRow("Length", lenRow));

  const count = makeNumber(1,1000,5,1); card.appendChild(fieldRow("How many", count));
  const lowerF = checkField("Lowercase", true); card.appendChild(lowerF.wrap);
  const upperF = checkField("Uppercase", true); card.appendChild(upperF.wrap);
  const digitsF = checkField("Digits", true); card.appendChild(digitsF.wrap);
  const symbolsF = checkField("Symbols", true); card.appendChild(symbolsF.wrap);
  const ambF = checkField("Exclude ambiguous characters"); card.appendChild(ambF.wrap);
  const noRepeatF = checkField("No repeated characters"); card.appendChild(noRepeatF.wrap);
  const pronounceF = checkField("Pronounceable mode (syllables)"); card.appendChild(pronounceF.wrap);

  const strengthBar = el("div", {class:"strength-bar"}, [el("div", {style:"width:0%; background:#666;"})]);
  card.appendChild(strengthBar);
  const strengthLbl = el("div", {class:"hint"}, "Preview strength appears after generating.");
  card.appendChild(strengthLbl);

  const AMBIGUOUS = "Il1O0|`'\",.;:";
  function charClasses(){
    const c = [];
    if (lowerF.input.checked) c.push("abcdefghijklmnopqrstuvwxyz");
    if (upperF.input.checked) c.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
    if (digitsF.input.checked) c.push("0123456789");
    if (symbolsF.input.checked) c.push("!@#$%^&*()-_=+[]{};:,.<>?/~");
    return c;
  }
  function buildCharset(){
    let s = charClasses().join("");
    if (ambF.input.checked) s = [...s].filter(c => !AMBIGUOUS.includes(c)).join("");
    return s;
  }
  function strengthOf(pw){
    if (!pw) return [0,"empty"];
    const classes = [/[a-z]/,/[A-Z]/,/[0-9]/,/[^a-zA-Z0-9]/].filter(r => r.test(pw)).length;
    let pool = 0;
    if (/[a-z]/.test(pw)) pool += 26;
    if (/[A-Z]/.test(pw)) pool += 26;
    if (/[0-9]/.test(pw)) pool += 10;
    if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
    pool = Math.max(pool,1);
    const entropy = pw.length * Math.log2(pool);
    let score = Math.min(100, Math.round(entropy/100*100*(classes/4+0.4)));
    score = Math.max(0, Math.min(100, score));
    const label = score<30?"Weak":score<55?"Fair":score<78?"Strong":"Excellent";
    return [score, label];
  }
  card.appendChild(primaryButton("Generate", () => {
    const len = +lengthWrap.value, n = +count.value;
    const items = [];
    if (pronounceF.input.checked){
      for (let i=0;i<n;i++){
        const vowels="aeiou", cons="bcdfghjklmnpqrstvwxyz";
        let s=""; let useC=true;
        while (s.length < len){ s += rc([...(useC?cons:vowels)]); useC=!useC; }
        s = s.slice(0,len);
        s = s.charAt(0).toUpperCase()+s.slice(1);
        items.push(s + String(ri(10,99)));
      }
      results.setItems(items, "Passwords");
      const [score,label] = strengthOf(items[0]);
      updateStrength(score,label);
      return;
    }
    const charset = buildCharset();
    if (!charset){ toast("Enable at least one character class."); return; }
    const required = charClasses().map(cls => ambF.input.checked ? [...cls].filter(c=>!AMBIGUOUS.includes(c)).join("") : cls);
    const noRepeat = noRepeatF.input.checked;
    if (noRepeat && len > new Set(charset).size){ toast("Length exceeds available unique characters for 'no repeat'."); return; }
    for (let i=0;i<n;i++){
      let pw = "";
      for (let attempt=0; attempt<200; attempt++){
        if (noRepeat){
          pw = shuffle([...new Set(charset)]).slice(0,len).join("");
        } else {
          pw = Array.from({length:len}, () => charset[ri(0,charset.length-1)]).join("");
        }
        if (required.every(cls => [...pw].some(c => cls.includes(c)))) break;
      }
      items.push(pw);
    }
    results.setItems(items, "Passwords");
    if (items.length){ const [score,label] = strengthOf(items[0]); updateStrength(score,label); }
  }));
  function updateStrength(score, label){
    const colors = {Weak:"#ef5b6f",Fair:"#f5b942",Strong:"#3ddc97",Excellent:"#3ddc97",empty:"#666"};
    strengthBar.firstChild.style.width = score + "%";
    strengthBar.firstChild.style.background = colors[label] || "#666";
    strengthLbl.textContent = `First password strength: ${label} (${score}/100)`;
  }
  const results = resultsColumn(body, {filenameBase:"passwords"});
});

registerPage("colors", "🎨", "Colors", "Core Generators", (container) => {
  pageHeader(container, "Colors", "Generate random colors with a live swatch preview.");
  const body = pageBody(container);
  const card = controlsCard(body);

  const styleSel = makeSelect(["Any","Pastel","Vivid","Dark","Grayscale"]);
  card.appendChild(fieldRow("Style", styleSel));
  const fmtSel = makeSelect(["HEX","RGB","RGBA","HSL"]);
  card.appendChild(fieldRow("Format", fmtSel));
  const count = makeNumber(1,200,12,1); card.appendChild(fieldRow("How many", count));

  const results = resultsColumn(body, {filenameBase:"colors"});
  const swatchGrid = el("div", {class:"swatch-grid"});
  results.colEl.appendChild(swatchGrid);

  function hslToRgb(h,s,l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
    return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
  }
  function randColor(style){
    let h,s,l;
    if (style==="Pastel"){ h=rf(0,360,1); s=rf(40,70,1); l=rf(75,90,1); }
    else if (style==="Vivid"){ h=rf(0,360,1); s=rf(75,100,1); l=rf(45,60,1); }
    else if (style==="Dark"){ h=rf(0,360,1); s=rf(30,80,1); l=rf(12,28,1); }
    else if (style==="Grayscale"){ const v = ri(0,255); return {r:v,g:v,b:v,h:0,s:0,l:v/255*100}; }
    else { const [r,g,b] = [ri(0,255),ri(0,255),ri(0,255)]; return {r,g,b,h:0,s:0,l:0}; }
    const [r,g,b] = hslToRgb(h,s,l);
    return {r,g,b,h,s,l};
  }
  function fmtColor(c, fmt){
    const hex = "#" + [c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
    if (fmt==="HEX") return hex;
    if (fmt==="RGB") return `rgb(${c.r}, ${c.g}, ${c.b})`;
    if (fmt==="RGBA") return `rgba(${c.r}, ${c.g}, ${c.b}, 1.0)`;
    const max=Math.max(c.r,c.g,c.b)/255, min=Math.min(c.r,c.g,c.b)/255;
    const l=(max+min)/2; let h=0,s=0;
    if (max!==min){
      const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
      if (max===c.r/255) h=((c.g/255-c.b/255)/d + (c.g<c.b?6:0));
      else if (max===c.g/255) h=(c.b/255-c.r/255)/d+2;
      else h=(c.r/255-c.g/255)/d+4;
      h*=60;
    }
    return `hsl(${Math.round(h)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
  }

  card.appendChild(primaryButton("Generate", () => {
    const n = +count.value;
    const colors = Array.from({length:n}, () => randColor(styleSel.value));
    const items = colors.map(c => fmtColor(c, fmtSel.value));
    results.setItems(items, "Colors");
    swatchGrid.innerHTML = "";
    colors.forEach((c,i) => {
      const lum = (0.299*c.r + 0.587*c.g + 0.114*c.b) / 255;
      const sw = el("div", {class:"swatch", style:`background:rgb(${c.r},${c.g},${c.b}); color:${lum>0.55?"#111":"#fff"};`}, items[i]);
      sw.addEventListener("click", () => copyText(items[i]));
      swatchGrid.appendChild(sw);
    });
  }));
});

  const startInput = el("input", {type:"date", value: twoYrsAgo.toISOString().slice(0,10)});
  card.appendChild(fieldRow("Start", startInput));
  const endInput = el("input", {type:"date", value: today.toISOString().slice(0,10)});
  card.appendChild(fieldRow("End", endInput));
  const timeF = checkField("Include random time of day"); card.appendChild(timeF.wrap);
  const fmtSel = makeSelect(["YYYY-MM-DD","MM/DD/YYYY","DD/MM/YYYY","Month D, YYYY","ISO 8601","Unix timestamp"]);

  const count = makeNumber(1,10000,10,1); card.appendChild(fieldRow("How many", count));
  const sortF = checkField("Sort chronologically"); card.appendChild(sortF.wrap);

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmtDate(d, fmt, hasTime){
    const pad = n => String(n).padStart(2,"0");
    if (fmt==="Unix timestamp") return String(Math.floor(d.getTime()/1000));
    if (fmt==="ISO 8601") return d.toISOString();
    let s;
    if (fmt==="YYYY-MM-DD") s = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    else if (fmt==="MM/DD/YYYY") s = `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`;
    else if (fmt==="DD/MM/YYYY") s = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
    else s = `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    if (hasTime) s += ` ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    return s;
  }

  const results = resultsColumn(body, {filenameBase:"dates"});
  card.appendChild(primaryButton("Generate", () => {
    let d0 = new Date(startInput.value), d1 = new Date(endInput.value);

    let dates = [];
    for (let i=0;i<n;i++){
      const offsetDays = ri(0, Math.round(spanMs/86400000));
      const d = new Date(d0.getTime() + offsetDays*86400000);
      if (hasTime){ d.setHours(ri(0,23), ri(0,59), ri(0,59)); } else d.setHours(0,0,0,0);
      dates.push(d);
    }
    if (sortF.input.checked) dates.sort((a,b)=>a-b);
    results.setItems(dates.map(d => fmtDate(d, fmtSel.value, hasTime)), "Dates & Times");
  }));
});

  card.appendChild(inputBox);

  const opSel = makeSelect(["MD5 hash","SHA-1 hash","SHA-256 hash","SHA-384 hash","SHA-512 hash",
    "Base64 encode","Base64 decode","URL encode","URL decode","HTML escape","HTML unescape",
    "To UPPERCASE","To lowercase","Reverse text","Generate slug (kebab-case)","Random token"]);
  card.appendChild(fieldRow("Operation", opSel));

  const results = resultsColumn(body, {filenameBase:"dev-tools", hint:"Click the result to copy it."});
  const runBtn = primaryButton("Run", async () => {
    const text = inputBox.value;
    const op = opSel.value;
    if (!text && op !== "Random token"){ toast("Type something in the input box first."); return; }
    let out;
    try{
      if (op==="MD5 hash") out = md5(text);
      else if (op==="SHA-1 hash") out = await sha(text,"SHA-1");
      else if (op==="SHA-256 hash") out = await sha(text,"SHA-256");
      else if (op==="SHA-384 hash") out = await sha(text,"SHA-384");
      else if (op==="SHA-512 hash") out = await sha(text,"SHA-512");
      else if (op==="Base64 encode") out = btoa(unescape(encodeURIComponent(text)));
      else if (op==="Base64 decode") out = decodeURIComponent(escape(atob(text)));
      else if (op==="URL encode") out = encodeURIComponent(text);
      else if (op==="URL decode") out = decodeURIComponent(text);
      else if (op==="HTML escape") out = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
      else if (op==="HTML unescape") out = text.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      else if (op==="To UPPERCASE") out = text.toUpperCase();
      else if (op==="To lowercase") out = text.toLowerCase();
      else if (op==="Reverse text") out = [...text].reverse().join("");
      else if (op==="Generate slug (kebab-case)") out = text.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").split(/\s+/).join("-");
      else { const len = Math.max(8, text.length); out = [...crypto.getRandomValues(new Uint8Array(len))].map(b=>b.toString(36)).join("").slice(0,len); }
    } catch(e){ toast("Operation failed: " + e.message); return; }
    results.setItems([out], "Dev Tools");
  });
  card.appendChild(runBtn);
});

registerPage("progression", "🎮", "Progression Scaler", "Advanced", (container) => {
  pageHeader(container, "Progression Scaler", "Generate level-up XP tables, crafting cost formulas, or currency curves for quick game-balancing reference. Export as CSV or JSON.");
  const body = pageBody(container);
  const card = controlsCard(body);

  const CURVES = ["Linear","Exponential","Polynomial","Fibonacci-based","Logistic (soft cap)"];
  const PARAMS_BY_CURVE = {
    "Linear": ["base","increment"], "Exponential": ["base","growth"], "Polynomial": ["base","exponent"],
    "Fibonacci-based": ["base"], "Logistic (soft cap)": ["cap","midpoint","steepness"],
  };
  const ROUND_OPTIONS = [["No rounding (nearest whole number)",1],["Nearest 5",5],["Nearest 10",10],["Nearest 50",50],["Nearest 100",100],["Nearest 1000",1000]];

  const metricInput = makeText("", "XP"); card.appendChild(fieldRow("Metric name", metricInput));
  const curveSel = makeSelect(CURVES); card.appendChild(fieldRow("Curve type", curveSel));

  const paramRows = {};
  function addParamRow(key, labelText, input){
    const row = fieldRow(labelText, input);
    card.appendChild(row);
    paramRows[key] = row;
    return input;
  }
  const baseInput = addParamRow("base", "Base value", makeNumber(0,1e9,100,0.01));
  const incInput = addParamRow("increment", "Increment / level", makeNumber(-1e6,1e6,50,0.01));
  const growthInput = addParamRow("growth", "Growth rate ×", makeNumber(1.001,10,1.15,0.001));
  const expInput = addParamRow("exponent", "Exponent", makeNumber(0.1,10,2,0.1));
  const capInput = addParamRow("cap", "Cap (asymptote)", makeNumber(1,1e9,100000,1));
  const midInput = addParamRow("midpoint", "Midpoint level", makeNumber(1,10000,25,1));
  const steepInput = addParamRow("steepness", "Steepness", makeNumber(0.01,5,0.3,0.01));

  function syncParamVisibility(){
    const active = new Set(PARAMS_BY_CURVE[curveSel.value] || []);
    for (const [key,row] of Object.entries(paramRows)) row.style.display = active.has(key) ? "flex" : "none";
  }
  curveSel.addEventListener("change", syncParamVisibility);
  syncParamVisibility();

  const startInput = makeNumber(1,100000,1,1); card.appendChild(fieldRow("Start level", startInput));
  const endInput = makeNumber(1,100000,50,1); card.appendChild(fieldRow("End level", endInput));
  const roundSel = makeSelect(ROUND_OPTIONS.map(([label]) => label)); card.appendChild(fieldRow("Round to", roundSel));
  const cumulativeF = checkField("Show cumulative total column", true); card.appendChild(cumulativeF.wrap);

  // ---- right column ----
  const right = el("div", {class:"results-col"}); body.appendChild(right);
  const head = el("div", {class:"results-head"}, [
    el("h3", {}, "Table"),
  ]);
  const countLabel = el("span", {class:"stat"}, "");
  head.appendChild(countLabel);
  head.appendChild(el("div", {class:"spacer"}));
  const copyTsvBtn = el("button", {class:"ghost"}, "Copy as TSV");
  const csvBtn = el("button", {class:"ghost"}, "Export CSV");
  const jsonBtn = el("button", {class:"ghost"}, "Export JSON");
  head.append(copyTsvBtn, csvBtn, jsonBtn);
  right.appendChild(head);

  const tableWrap = el("div", {class:"table-wrap"});
  const table = el("table", {class:"data-table"});
  tableWrap.appendChild(table);
  right.appendChild(tableWrap);
  right.appendChild(el("div", {}, [el("div", {class:"hint", style:"margin:10px 0 4px;"}, "Curve preview")]));
  const canvas = el("canvas", {class:"curve-canvas"});
  right.appendChild(canvas);

  let state = { levels:[], values:[], cumulative:[], metric:"XP" };

  function rawValue(curve, level, start){
    const base = +baseInput.value;
    if (curve==="Linear") return base + (level-start) * (+incInput.value);
    if (curve==="Exponential") return base * Math.pow(+growthInput.value, level-start);
    if (curve==="Polynomial") return base * Math.pow(level, +expInput.value);
    if (curve==="Fibonacci-based") return base * fibSeq(level-start+1);
    if (curve.startsWith("Logistic")){
      const cap = +capInput.value, mid = +midInput.value, k = +steepInput.value;
      return cap / (1 + Math.exp(-k*(level-mid)));
    }
    return 0;
  }
  function applyRound(v, granularity){
    if (granularity <= 1) return Math.round(v);
    return Math.round(v/granularity) * granularity;
  }

  function drawChart(values){
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const w = rect.width, h = rect.height, pad = 8;
    ctx.clearRect(0,0,w,h);
    if (values.length < 2) return;
    const vmin = Math.min(...values), vmax0 = Math.max(...values);
    const vmax = vmax0 === vmin ? vmin+1 : vmax0;
    const stepX = (w - pad*2) / (values.length-1);
    const pts = values.map((v,i) => [pad+i*stepX, pad + (h-pad*2) - (v-vmin)/(vmax-vmin)*(h-pad*2)]);
    ctx.beginPath(); ctx.moveTo(pts[0][0], h-pad);
    pts.forEach(p => ctx.lineTo(p[0],p[1]));
    ctx.lineTo(pts[pts.length-1][0], h-pad); ctx.closePath();
    ctx.fillStyle = "rgba(124,108,246,0.18)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    pts.forEach(p => ctx.lineTo(p[0],p[1]));
    ctx.strokeStyle = "#7c6cf6"; ctx.lineWidth = 2.2; ctx.stroke();
  }

  function populateTable(){
    const showCum = cumulativeF.input.checked;
    table.innerHTML = "";
    const thead = el("thead", {}, [el("tr", {}, [
      el("th", {}, "Level"), el("th", {}, state.metric),
      ...(showCum ? [el("th", {}, `Cumulative ${state.metric}`)] : [])
    ])]);
    table.appendChild(thead);
    const tbody = el("tbody");
    state.levels.forEach((lvl,i) => {
      tbody.appendChild(el("tr", {}, [
        el("td", {}, String(lvl)), el("td", {}, String(state.values[i])),
        ...(showCum ? [el("td", {}, String(state.cumulative[i]))] : [])
      ]));
    });
    table.appendChild(tbody);
  }

  function generate(){
    const start = +startInput.value, end = +endInput.value;
    if (end < start){ toast("End level must be ≥ start level."); return; }
    if (end - start > 20000){ toast("That's a very large level range — keep it under 20,000 rows."); return; }
    const curve = curveSel.value;
    const metric = metricInput.value.trim() || "XP";
    const granularity = ROUND_OPTIONS[roundSel.selectedIndex][1];
    const levels = []; for (let l=start; l<=end; l++) levels.push(l);
    const values = levels.map(l => applyRound(rawValue(curve,l,start), granularity));
    const cumulative = []; let total=0;
    values.forEach(v => { total+=v; cumulative.push(total); });
    state = {levels, values, cumulative, metric};
    populateTable();
    drawChart(values);
    countLabel.textContent = `${levels.length} level(s)`;
    logHistory("Progression Scaler", [`${metric} curve: ${curve}, levels ${start}-${end}`]);
  }
  card.appendChild(primaryButton("Generate Table", generate));

  function rowsForExport(){
    const showCum = cumulativeF.input.checked;
    const header = ["Level", state.metric].concat(showCum ? [`Cumulative ${state.metric}`] : []);
    const rows = state.levels.map((lvl,i) => [lvl, state.values[i]].concat(showCum ? [state.cumulative[i]] : []));
    return {header, rows};
  }
  copyTsvBtn.addEventListener("click", () => {
    if (!state.levels.length){ toast("Generate a table first."); return; }
    const {header, rows} = rowsForExport();
    copyText([header.join("\t")].concat(rows.map(r=>r.join("\t"))).join("\n"));
  });
  csvBtn.addEventListener("click", () => {
    if (!state.levels.length){ toast("Generate a table first."); return; }
    const {header, rows} = rowsForExport();
    const csvBody = [header.join(",")].concat(rows.map(r=>r.join(","))).join("\n");
    downloadBlob(`${state.metric.toLowerCase().replace(/\s+/g,"_")}_curve.csv`, csvBody, "text/csv");
  });
  jsonBtn.addEventListener("click", () => {
    if (!state.levels.length){ toast("Generate a table first."); return; }
    const showCum = cumulativeF.input.checked;
    const payload = {
      metric: state.metric, curve_type: curveSel.value, start_level: +startInput.value, end_level: +endInput.value,
      rounding: ROUND_OPTIONS[roundSel.selectedIndex][0],
      levels: state.levels.map((lvl,i) => Object.assign({level:lvl, value:state.values[i]}, showCum ? {cumulative: state.cumulative[i]} : {})),
    };
    downloadBlob(`${state.metric.toLowerCase().replace(/\s+/g,"_")}_curve.json`, JSON.stringify(payload,null,2), "application/json");
  });

  window.addEventListener("resize", () => { if (state.values.length) drawChart(state.values); });
});

    "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 Version/17.4 Safari/605.1.15",
    "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1",
    "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
    "Mozilla/5.0 (Android 14; Mobile) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36",
  ];

  function buildProfile(loc, selected, ageMin, ageMax){
    const p = {};
    const first = rc(loc.first), last = rc(loc.last);
    if (selected.has("name")) p["Name"] = `${first} ${last}`;
    if (selected.has("age_dob")){
      const age = ri(ageMin, ageMax);
      const now = new Date();
      const dob = new Date(now.getFullYear()-age, ri(0,11), ri(1,28));
      p["Date of Birth"] = dob.toISOString().slice(0,10);
      p["Age"] = String(age);
    }
    if (selected.has("occupation")) p["Occupation"] = rc(JOBS);
    if (selected.has("employer")) p["Employer"] = `${rc(loc.last)}, ${rc(loc.last)} and ${rc(loc.last)}`;
    if (selected.has("ssn")) p["SSN (synthetic)"] = loc.ssnFmt();
    if (selected.has("email")) p["Email"] = `${first.toLowerCase()}.${last.toLowerCase()}${ri(0,998)}@${rc(DOMAINS)}`;
    if (selected.has("phone")) p["Phone"] = loc.phone();
    if (selected.has("address")){
      const [city,state] = rc(loc.cities);
      const streetNum = ri(100,9999);
      p["Address"] = `${streetNum} ${rc(STREET_NAMES)} ${rc(STREET_TYPES)}, ${city}${state?", "+state:""} ${ri(10000,99999)}, ${loc.country}`;
    }
    if (selected.has("card")){
      const brand = rc(["Visa","Mastercard","American Express","Discover"]);
      const num = fakeCardNumber(brand);
      const expY = new Date().getFullYear() + ri(1,5);
      const exp = `${String(ri(1,12)).padStart(2,"0")}/${String(expY).slice(2)}`;
      const cvv = brand==="American Express" ? String(ri(1000,9999)) : String(ri(100,999));
      p["Card (synthetic)"] = `${brand} ${num} • Exp ${exp} • CVV ${cvv}`;
    }
    if (selected.has("bank")){
      const acct = String(ri(100000000,999999999));
      const routing = String(ri(100000000,999999999)).slice(0,9);
      p["Bank (synthetic)"] = `Acct ${acct} • Routing ${routing} • IBAN ${synthIban()} • SWIFT ${synthSwift()}`;
    }
    if (selected.has("credit_score")) p["Credit Score (synthetic)"] = String(ri(300,850));
    if (selected.has("username")) p["Username"] = `${first.toLowerCase()}${last.toLowerCase()}${ri(0,98)}`;
    if (selected.has("password")) p["Sample Password"] = Array.from({length:14}, () => rc([..."abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"])).join("");
    if (selected.has("website")) p["Website"] = `http://www.${last.toLowerCase()}${rc(WORD_BANK)}.${rc(TLDS)}/`;
    if (selected.has("ip")) p["IP Address"] = Array.from({length:4}, () => ri(1,254)).join(".");
    if (selected.has("user_agent")) p["User Agent"] = rc(UAS);
    if (selected.has("height_weight")) p["Height / Weight"] = `${ri(150,200)} cm / ${ri(45,110)} kg`;
    if (selected.has("blood_type")) p["Blood Type"] = rc(["A+","A-","B+","B-","AB+","AB-","O+","O-"]);
    if (selected.has("vehicle")) p["Vehicle"] = `${rc(VEHICLE_MAKES)} • Plate ${rc([..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"])}${rc([..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"])}${rc([..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"])}-${ri(1000,9999)}`;
    return p;
  }

  function render(){
    const blocks = profiles.map((p,i) => {
      const lines = [`── Profile #${i+1} ──`];
      for (const [k,v] of Object.entries(p)) lines.push(`${k}: ${v}`);
      return lines.join("\n");
    });
    output.textContent = blocks.join("\n\n");
    countLbl.textContent = profiles.length ? `${profiles.length} profile${profiles.length===1?"":"s"}` : "";
  }

  card.appendChild(primaryButton("Generate Profiles", () => {
    const selected = new Set(Object.entries(checks).filter(([,c]) => c.checked).map(([k]) => k));
    if (!selected.size){ toast("Toggle at least one field to include."); return; }
    let ageMin = +minAge.value, ageMax = +maxAge.value;
    if (ageMin > ageMax) [ageMin, ageMax] = [ageMax, ageMin];
    const loc = LOCALE_DATA[localeSel.value];
    RNG.seed(seedInput.value.trim());
    const n = +count.value;
    profiles = Array.from({length:n}, () => buildProfile(loc, selected, ageMin, ageMax));
    RNG.seed(""); // don't let the seed leak into other pages
    render();
    logHistory("Fake Profiles", profiles.map((p,i) => p["Name"] || `Profile ${i+1}`));
  }));

  copyAllBtn.addEventListener("click", () => copyText(output.textContent));
  clearBtn.addEventListener("click", () => { profiles = []; render(); });
  exportBtn.addEventListener("click", () => {
    if (!profiles.length){ toast("Generate some profiles first."); return; }
    const fmt = fmtSel.value;
    const disclaimer = "All data is synthetically generated and not linked to any real person, account, or number. For mockups, demos, and testing only.";
    if (fmt === "txt") downloadBlob("fake_profiles.txt", `# ${disclaimer}\n\n` + output.textContent, "text/plain");
    else if (fmt === "json") downloadBlob("fake_profiles.json", JSON.stringify({disclaimer, profiles}, null, 2), "application/json");
    else {
      const fieldnames = []; profiles.forEach(p => Object.keys(p).forEach(k => { if (!fieldnames.includes(k)) fieldnames.push(k); }));
      const rows = profiles.map(p => fieldnames.map(k => `"${String(p[k]??"").replace(/"/g,'""')}"`).join(","));
      downloadBlob("fake_profiles.csv", `# ${disclaimer}\n` + [fieldnames.join(",")].concat(rows).join("\n"), "text/csv");
    }
  });
});

/* ============================================================
   PAGE: Bulk Renamer
   ============================================================ */
registerPage("renamer", "📝", "Bulk Renamer", "Tools", (container) => {
  pageHeader(container, "Bulk Renamer", "Select files or a folder, set a prefix, and get renamed copies — prefix1, prefix2, prefix3…");
  const body = pageBody(container);
  const card = controlsCard(body);

  card.appendChild(el("div", {class:"notice"},
    "Browsers can't rename files on your device in place (that's a security restriction, not a limitation of this tool). " +
    "Instead, pick files or a folder below and download a ZIP containing renamed copies — drop those in to replace the originals."));

  const fileInput = el("input", {type:"file", multiple:"multiple", style:"display:none;"});
  const folderInput = el("input", {type:"file", multiple:"multiple", webkitdirectory:"", style:"display:none;"});
  card.append(fileInput, folderInput);

  const btnRow = el("div", {class:"btn-row"});
  const pickFilesBtn = el("button", {}, "Select Files…");
  const pickFolderBtn = el("button", {}, "Select Folder…");
  btnRow.append(pickFilesBtn, pickFolderBtn);
  card.appendChild(btnRow);
  pickFilesBtn.addEventListener("click", () => fileInput.click());
  pickFolderBtn.addEventListener("click", () => folderInput.click());

  const selectionLabel = el("div", {class:"hint"}, "Nothing selected yet.");
  card.appendChild(selectionLabel);

  const recursiveF = checkField("Include subfolders (folder mode)", true);
  card.appendChild(recursiveF.wrap);

  const prefixInput = makeText("", "file_"); card.appendChild(fieldRow("Prefix", prefixInput));
  const startInput = makeNumber(0,1000000,1,1); card.appendChild(fieldRow("Start at", startInput));
  const zeroPadF = checkField("Zero-pad numbers"); card.appendChild(zeroPadF.wrap);
  const padWidth = makeNumber(1,10,3,1); card.appendChild(fieldRow("Pad width", padWidth));
  const keepExtF = checkField("Keep original file extension", true); card.appendChild(keepExtF.wrap);
  const sortSel = makeSelect(["Name (A–Z)","Name (Z–A)","Date modified (oldest first)","Date modified (newest first)","Size (smallest first)","Size (largest first)","Selection order"]);
  card.appendChild(fieldRow("Order by", sortSel));

  const downloadBtn = primaryButton("Download Renamed Copies (ZIP)", doDownload);
  downloadBtn.disabled = true;
  card.appendChild(downloadBtn);

  const right = el("div", {class:"results-col"}); body.appendChild(right);
  const previewCount = el("span", {class:"stat"}, "");
  right.appendChild(el("div", {class:"results-head"}, [el("h3", {}, "Preview"), previewCount]));
  const previewList = el("div", {class:"results-list"});
  previewList.appendChild(el("div", {class:"empty"}, "Select files or a folder to preview renamed names."));
  right.appendChild(previewList);
  right.appendChild(el("div", {class:"hint"}, "Rows in red would collide with another renamed item in this batch — fix your options before downloading."));

  let files = []; // {file, relPath}

  function onFilesChosen(fileList, isFolder){
    files = [...fileList].map(f => ({file:f, relPath: f.webkitRelativePath || f.name}));
    selectionLabel.textContent = isFolder
      ? `Folder selection: ${files.length} file(s) found`
      : `${files.length} file(s) selected`;
    updatePreview();
  }
  fileInput.addEventListener("change", () => onFilesChosen(fileInput.files, false));
  folderInput.addEventListener("change", () => onFilesChosen(folderInput.files, true));
  [recursiveF.input, prefixInput, startInput, zeroPadF.input, padWidth, keepExtF.input, sortSel].forEach(w =>
    w.addEventListener("input", updatePreview) || w.addEventListener("change", updatePreview));

  function activeFiles(){
    if (!recursiveF.input.checked){
      // "non-recursive": keep only files directly inside the picked root (relPath has <=1 folder segment)
      return files.filter(f => f.relPath.split("/").length <= 2);
    }
    return files;
  }
  function sortedFiles(){
    const arr = activeFiles().slice();
    const key = sortSel.value;
    if (key.startsWith("Name (A")) arr.sort((a,b) => a.file.name.toLowerCase().localeCompare(b.file.name.toLowerCase()));
    else if (key.startsWith("Name (Z")) arr.sort((a,b) => b.file.name.toLowerCase().localeCompare(a.file.name.toLowerCase()));
    else if (key === "Date modified (oldest first)") arr.sort((a,b) => a.file.lastModified - b.file.lastModified);
    else if (key === "Date modified (newest first)") arr.sort((a,b) => b.file.lastModified - a.file.lastModified);
    else if (key === "Size (smallest first)") arr.sort((a,b) => a.file.size - b.file.size);
    else if (key === "Size (largest first)") arr.sort((a,b) => b.file.size - a.file.size);
    return arr;
  }
  function extOf(name){ const i = name.lastIndexOf("."); return i > 0 ? name.slice(i) : ""; }
  function computeNewNames(){
    const arr = sortedFiles();
    const prefix = prefixInput.value;
    const start = +startInput.value;
    const keepExt = keepExtF.input.checked;
    return arr.map((item, idx) => {
      const num = start + idx;
      const numStr = zeroPadF.input.checked ? String(num).padStart(+padWidth.value, "0") : String(num);
      const newName = keepExt ? `${prefix}${numStr}${extOf(item.file.name)}` : `${prefix}${numStr}`;
      return {item, newName};
    });
  }
  function updatePreview(){
    const pairs = computeNewNames();
    previewList.innerHTML = "";
    if (!pairs.length){
      previewList.appendChild(el("div", {class:"empty"}, "Select files or a folder to preview renamed names."));
      previewCount.textContent = "";
      downloadBtn.disabled = true;
      return;
    }
    const seen = new Map();
    let conflicts = 0;
    pairs.forEach(({item,newName}) => {
      const count = (seen.get(newName) || 0) + 1;
      seen.set(newName, count);
    });
    pairs.forEach(({item,newName}) => {
      const conflict = seen.get(newName) > 1;
      if (conflict) conflicts++;
      const row = el("div", {class:"result-item" + (conflict ? " conflict" : "")}, [el("span", {}, `${item.file.name}    →    ${newName}`)]);
      previewList.appendChild(row);
    });
    previewCount.textContent = `${pairs.length} item(s)` + (conflicts ? ` — ${conflicts} conflict(s)` : "");
    downloadBtn.disabled = conflicts > 0;
  }

  async function doDownload(){
    const pairs = computeNewNames();
    if (!pairs.length){ toast("Select files or a folder first."); return; }
    downloadBtn.disabled = true;
    downloadBtn.textContent = "Zipping…";
    try{
      const zip = new JSZip();
      for (const {item,newName} of pairs){
        const buf = await item.file.arrayBuffer();
        zip.file(newName, buf);
      }
      const blob = await zip.generateAsync({type:"blob"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "renamed_files.zip";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      logHistory("Bulk Renamer", pairs.map(p => p.newName));
      toast(`Downloaded ${pairs.length} renamed file(s) as ZIP`);
    } catch(e){
      toast("Couldn't build ZIP: " + e.message);
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = "Download Renamed Copies (ZIP)";
    }
  }
});

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function initApp(){
  renderSidebar();
  renderHistory();
  applyTheme();
  selectPage(NAV[0].key);

  document.getElementById("themeToggle").addEventListener("click", () => { isDark = !isDark; applyTheme(); });

  const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  document.getElementById("paletteKbdHint").textContent = isMac ? "⌘ K" : "Ctrl K";
  document.getElementById("paletteHint").addEventListener("click", openPalette);
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); }
    else if (e.key === "Escape") closePalette();
  });
  document.getElementById("palette-overlay").addEventListener("click", (e) => { if (e.target.id === "palette-overlay") closePalette(); });
  const paletteInput = document.getElementById("paletteInput");
  paletteInput.addEventListener("input", () => renderPaletteResults(paletteInput.value));
  paletteInput.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown"){ e.preventDefault(); movePaletteSel(1); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); movePaletteSel(-1); }
    else if (e.key === "Enter"){ e.preventDefault(); if (paletteMatches[paletteSel]){ selectPage(paletteMatches[paletteSel].key); closePalette(); } }
  });

  const drawer = document.getElementById("history-drawer");
  document.getElementById("historyToggle").addEventListener("click", () => drawer.classList.toggle("open"));
  document.getElementById("historyClose").addEventListener("click", () => drawer.classList.remove("open"));
  document.getElementById("historyClear").addEventListener("click", () => { historyEntries.length = 0; renderHistory(); });

  document.getElementById("hamburgerBtn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));

  document.getElementById("globalSeed").addEventListener("input", (e) => RNG.seed(e.target.value.trim()));

  document.getElementById("aboutBtn").addEventListener("click", () => {
    const overlay = el("div", {id:"about-overlay", style:"position:fixed; inset:0; background:rgba(5,6,10,.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:700;"});
    const box = el("div", {class:"card", style:"max-width:440px; padding:24px; margin:16px;"}, [
      el("h2", {style:"font-family:var(--font-display); margin:0 0 10px;"}, "Random Studio"),
      el("div", {class:"hint", style:"line-height:1.7; font-size:12.5px;"},
        "A fast, modern, all-in-one random data & developer QoL toolkit — built to run entirely in your browser, no server, no accounts, no data leaving your device.\n\n" +
        "Numbers · Strings · Passwords · UUIDs · Colors · Names · Dates · Lorem Ipsum · List Tools · Network · Words · Dev Tools · Bulk Renamer · Fake Profiles · Text Scrambler · Progression Scaler"),
      el("button", {class:"primary", style:"margin-top:16px;", onclick:() => overlay.remove()}, "Close"),
    ]);
    overlay.appendChild(box);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
  });
}
document.addEventListener("DOMContentLoaded", initApp);
</script>
